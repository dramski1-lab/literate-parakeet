name: Remove Ramski from Data Brokers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print actions without sending requests)"
        type: boolean
        default: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run opt-out script
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 remove_ramski.py --dry-run
          else
            python3 remove_ramski.py
          fi
